events { worker_connections 4096; }

http {
  upstream ticketing_app {
    least_conn;                       # send each request to the instance with fewest active connections
    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://ticketing_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
    }
  }
}
